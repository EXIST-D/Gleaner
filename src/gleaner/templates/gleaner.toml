# Gleaner 工作区配置。相对路径以本文件所在目录为基准，可以使用 ~。

# 不带 --keyword 运行 `gleaner crawl <平台>` 时使用的搜索关键词（所有平台共用）
keywords = ["后端 面经", "Java 一面"]

# 小红书、抖音、B 站、知乎通过 MediaCrawler 抓取
[mediacrawler]
# 你本机的 MediaCrawler 目录（https://github.com/NanmiCoder/MediaCrawler），各自下载安装。
# 默认对应仓库根目录下的 MediaCrawler/（工作区是仓库下的 workspace/ 时；该目录已被 git 忽略）
home = "../MediaCrawler"
# 在 home 目录下启动 MediaCrawler 的命令；没有 uv 时可改成 [".venv/bin/python", "main.py"]
command = ["uv", "run", "main.py"]
# qrcode | phone | cookie；CDP 模式连接已登录的 Chrome 时保持 qrcode 即可
login_type = "qrcode"
# 搜索时每个关键词抓多少篇。搜索按页返回（抖音每页 10 篇，其余平台每页 20 篇）：不足一页按一页算，
# 其余按整页向下取整，上限 40。MediaCrawler 许可证禁止大规模爬取，请保持小批量
max_notes = 20
# 单次运行超时（秒）
timeout_seconds = 900
# 同一平台两次抓取之间至少间隔多少分钟；--force 可跳过
min_interval_minutes = 5

# 牛客由 Gleaner 直接读取公开的面经列表和帖子（不登录、不使用站内搜索）
[nowcoder]
# 每个关键词最多保存多少篇（1–40）
max_notes = 20
# 每次最多翻阅多少页最新面经列表（每页 20 篇，1–25），在标题和摘要里找关键词
scan_pages = 5
# 两次请求之间至少间隔多少秒（不小于 1），另加最多 1 秒随机抖动
request_interval_seconds = 3
# 是否下载帖子里的图片（截图里的题需要看图导入）
download_images = true
# 单次运行超时（秒）
timeout_seconds = 600
# 两次抓取之间至少间隔多少分钟；--force 可跳过
min_interval_minutes = 5

[screening]
# 追加到内置词表的词，用于规则初筛；内置词表见 src/gleaner/screening.py
interview_terms = []
event_terms = []
promo_terms = []
strong_promo_terms = []
collection_terms = []
# B 站视频标题或简介含这些词（内置：录音、实录、面试全程、全程面试、真实面试）时标成面试录音，可以下载转写
recording_terms = []

# B 站面试录音：`gleaner media` 下载视频，打包时转成音频交给 Interview Bank 转写
[media]
# ffmpeg 命令或路径。MediaCrawler 靠它合成 B 站分开下载的音频和画面，打包时也用它提取音频。
# 文件名必须叫 ffmpeg（可以是指向别的 ffmpeg 程序的链接）
ffmpeg = "ffmpeg"
# 下载视频时单次运行的超时（秒）；B 站下载较慢，半小时的录音可能要十几分钟
download_timeout_seconds = 3600

# `gleaner auto`：一条命令走完 抓取 → 下载录音 → 打包，适合交给定时任务
[auto]
# 抓取哪些平台（xhs、dy、bili、zhihu、nowcoder），按这个顺序；留空表示全部（牛客最先，不用登录）
platforms = []
# 每次最多下载几个 B 站面试录音（长视频下载要十几分钟）；0 表示不自动下载
max_recordings = 2

# 转写录音时专业词常被听错：内置了一份常见误识别（`gleaner glossary` 查看），会写进素材包的 HANDOFF.md
[glossary]
# 追加自己的，每项写成 "听成的写法 = 正确写法"
extra = []

[handoff]
# 独立的采集题库目录（不要用个人题库）。首次使用前运行：python3 <ibank.py> init --bank <目录>
# 默认对应仓库根目录下的 collected-bank/（已被 git 忽略）
bank = "../collected-bank"
# Interview Bank 的 ibank.py 路径，用于生成素材包里的导入命令
ibank = ""
# 运行 ibank.py 的 Python（需要 3.10+）
python = "python3"
# 转写录音用的 Python，需要装 faster-whisper（pip install faster-whisper）；留空就用上面的 python
asr_python = ""
# 转写模型。large-v3-turbo 对专业词识别明显好于 small，第一次使用下载约 1.5 GB
asr_model = "large-v3-turbo"
